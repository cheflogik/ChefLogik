namespace: cheflogik-staging
manage_namespace: true

image:
  repository: ghcr.io/dishuoberoi/cheflogik-admin
  pullSecret: ghcr-secret

# Note: VITE_* variables are baked in at Docker build time by Vite.
# Configure them as build args in the Jenkins pipeline, not as runtime env.
env:
  NODE_ENV: staging
  VITE_API_URL: https://api-staging.cheflogik.com/api/v1
  VITE_STAFF_APP_URL: https://app-staging.cheflogik.com

buildArgs:
  NODE_ENV: staging
  VITE_API_URL: https://api-staging.cheflogik.com/api/v1
  VITE_STAFF_APP_URL: https://app-staging.cheflogik.com

domains:
  - admin-staging.cheflogik.com

secrets:
  provider: infisical
  projectId: "80c1f3ad-b1ed-4eff-8330-c807e55bc227"
  environment: "staging"
  secretPath: "/"
  tags:
    - "admin"
  stripPrefix: ""

web:
  containerPort: 5600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

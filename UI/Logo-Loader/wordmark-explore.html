<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChefLogik — Wordmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1B2D;
    --paper: #FAF8F2;
    --amber: oklch(0.74 0.13 75);
  }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  cl-mark {
    display: inline-block;
    line-height: 0;
    flex: none;
    width: 96px;
    height: 96px;
  }
  cl-mark svg { display: block; width: 100%; height: 100%; }

  .lockup {
    display: inline-flex;
    align-items: center;
    gap: 24px;
  }

  .wordmark {
    display: inline-flex;
    align-items: baseline;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -0.025em;
    white-space: nowrap;
    color: var(--ink);
  }
  .wordmark .chef  { font-weight: 500; }
  .wordmark .logik { font-weight: 800; display: inline-flex; align-items: baseline; }
  .wordmark .dotless-i {
    width: 0.22em;
    height: 0.96em;
    display: inline-block;
    vertical-align: baseline;
    margin-right: 0.015em;
  }
</style>
</head>
<body>

<template id="cl-mark-tpl">
  <svg viewBox="0 0 80 80" fill="none" aria-label="ChefLogik mark">
    <circle cx="40" cy="11" r="2.8" fill="currentColor" />
    <line x1="40" y1="14" x2="40" y2="20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    <path d="M16 38 Q16 20 40 20 Q64 20 64 38" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" />
    <line x1="16" y1="38" x2="64" y2="38" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="46" x2="33" y2="50" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round" />
    <line x1="47" y1="46" x2="47" y2="50" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round" />
    <rect x="28" y="56" width="24" height="2.5" rx="0.6" fill="var(--amber)" />
    <path d="M30 56 Q30 50 40 49 Q50 50 50 56 Z" fill="var(--amber)" />
    <path d="M33 52.5 Q40 50.5 47 52.5" stroke="#fff" stroke-opacity="0.32" stroke-width="0.7" fill="none" stroke-linecap="round" />
    <circle cx="40" cy="48.5" r="1.3" fill="currentColor" />
    <ellipse cx="40" cy="62" rx="28" ry="2.6" fill="currentColor" opacity="0.18" />
    <path d="M10 60 Q40 66 70 60" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" />
  </svg>
</template>

<script>
  customElements.define('cl-mark', class extends HTMLElement {
    connectedCallback() {
      if (this.childElementCount) return;
      this.appendChild(document.getElementById('cl-mark-tpl').content.cloneNode(true));
    }
  });
</script>

<div class="lockup">
  <cl-mark></cl-mark>
  <span class="wordmark">
    <span class="chef">Chef</span><span class="logik">Log<svg class="dotless-i" viewBox="0 0 22 100" aria-hidden="true"><rect x="4" y="36" width="14" height="44" rx="1.5" fill="currentColor"/><circle cx="11" cy="22" r="9" fill="var(--amber)"/></svg>k</span>
  </span>
</div>

</body>
</html>

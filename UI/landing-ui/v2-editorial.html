<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aubergine · Editorial</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100a0c;
    --bg-soft: #170f12;
    --bg-card: #1f1418;
    --bg-elev: #2a1a20;
    --wine: #b13449;
    --wine-deep: #6b1f2d;
    --wine-bright: #d04e63;
    --coral: #e08a8a;
    --cream: #f1e7d6;
    --cream-2: #b8a89a;
    --muted: #6e5e62;
    --divider: #2a1b22;
    --divider-2: #3a2731;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    font-feature-settings:"ss01","cv11";
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--wine);color:var(--cream)}

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(800px 600px at 80% 10%, rgba(177,52,73,.13), transparent 60%),
      radial-gradient(700px 500px at 10% 70%, rgba(177,52,73,.06), transparent 60%);
  }

  /* layout */
  .wrap{max-width:1320px;margin:0 auto;padding:0 56px;position:relative;z-index:1}
  .smcaps{font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:700}
  .num-eyebrow{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--wine)}
  .accent{color:var(--wine)}

  /* === NAV === */
  .nav{position:sticky;top:0;z-index:50;background:rgba(16,10,12,.84);backdrop-filter:blur(14px);border-bottom:1px solid var(--divider)}
  .nav-inner{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    height:64px;padding:0 56px;max-width:1440px;margin:0 auto;
  }
  .nav-left{display:flex;gap:28px;font-size:13px;color:var(--cream-2);font-weight:500;letter-spacing:.02em}
  .nav-left a{padding:6px 2px;border-bottom:1px solid transparent;transition:.2s}
  .nav-left a:hover{color:var(--wine);border-color:var(--wine)}
  .brand{display:flex;align-items:baseline;gap:12px;justify-content:center}
  .brand .m{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--cream)}
  .brand .x{font-size:11px;letter-spacing:.28em;color:var(--wine);text-transform:uppercase;font-weight:700}
  .nav-right{display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .iconbtn{
    width:38px;height:38px;border-radius:0;border:1px solid var(--divider-2);background:transparent;
    color:var(--cream-2);display:inline-flex;align-items:center;justify-content:center;
    transition:.2s;position:relative;
  }
  .iconbtn:hover{border-color:var(--wine);color:var(--wine)}
  .iconbtn .badge{
    position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;
    background:var(--wine);color:var(--cream);font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .btn-wine{
    background:var(--wine);color:var(--cream);border:none;padding:13px 22px;
    font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    transition:.2s;display:inline-flex;align-items:center;gap:10px;
  }
  .btn-wine:hover{background:var(--wine-bright)}
  .btn-line{
    background:transparent;border:1px solid var(--cream-2);color:var(--cream);padding:13px 22px;
    font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:.2s;
    display:inline-flex;align-items:center;gap:10px;
  }
  .btn-line:hover{border-color:var(--wine);color:var(--wine)}

  /* === HERO (asymmetric grid) === */
  .hero{padding:48px 0 24px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1.05fr 1.4fr;gap:48px;align-items:end}
  .hero-l{padding-bottom:8px}
  .hero-issue{display:flex;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--divider-2);margin-bottom:48px}
  .hero-issue .x{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--cream-2);letter-spacing:.2em}
  .hero-issue .x b{color:var(--wine);font-weight:700}
  .hero-l h1{
    font-size:148px;font-weight:800;letter-spacing:-.05em;line-height:.85;margin:0;color:var(--cream);
  }
  .hero-l h1 em{
    font-style:italic;font-weight:300;color:var(--wine);
    background:linear-gradient(180deg, transparent 60%, rgba(177,52,73,.18) 60%);padding:0 .04em;
  }
  .hero-l .lede{font-size:18px;line-height:1.5;color:var(--cream-2);margin:36px 0 0;font-weight:400;max-width:480px}
  .hero-l .by{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:24px}
  .hero-l .by b{color:var(--cream)}
  .hero-actions{display:flex;gap:14px;margin-top:36px}
  .hero-r{position:relative}
  .hero-img-big{
    aspect-ratio:4/5;background:var(--bg-card);position:relative;
    border:1px solid var(--divider);overflow:hidden;
  }
  .hero-img-big svg{width:100%;height:100%;display:block}
  .hero-r .badge-bl{
    position:absolute;left:-32px;bottom:32px;background:var(--wine);color:var(--cream);
    padding:14px 22px;font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  }
  .hero-r .stats{
    position:absolute;right:-24px;top:32px;background:var(--bg);border:1px solid var(--divider-2);
    padding:24px 28px;display:flex;flex-direction:column;gap:14px;min-width:200px;
  }
  .hero-r .stats .row{display:flex;justify-content:space-between;gap:16px;align-items:baseline;font-size:13px;color:var(--cream-2);padding-bottom:10px;border-bottom:1px dotted var(--divider-2)}
  .hero-r .stats .row:last-child{border-bottom:none;padding-bottom:0}
  .hero-r .stats .row .v{color:var(--cream);font-weight:700;font-size:14px}
  .hero-r .stats .row .v.accent{color:var(--wine)}

  .hero-strip{
    margin-top:64px;border-top:1px solid var(--divider-2);border-bottom:1px solid var(--divider-2);
    padding:18px 0;display:flex;justify-content:space-between;align-items:center;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-2);font-weight:600;
  }
  .hero-strip .marquee{display:flex;gap:48px;align-items:center}
  .hero-strip .dot{width:5px;height:5px;background:var(--wine);border-radius:50%}

  /* === QUICK TABS (horizontal pills) === */
  .qtabs{display:flex;gap:0;margin:48px 0 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
  .qtab{
    flex:1;padding:28px 24px;background:transparent;color:var(--cream-2);border:none;
    border-right:1px solid var(--divider);text-align:left;cursor:pointer;transition:.2s;
    display:flex;flex-direction:column;gap:10px;position:relative;font-family:inherit;
  }
  .qtab:last-child{border-right:none}
  .qtab:hover{background:rgba(177,52,73,.04);color:var(--cream)}
  .qtab.active{background:rgba(177,52,73,.07);color:var(--cream)}
  .qtab.active::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--wine)}
  .qtab .num{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.2em;color:var(--wine)}
  .qtab .name{font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--cream)}
  .qtab .desc{font-size:12px;color:var(--cream-2);font-weight:400}

  /* === SECTION === */
  .section{padding:96px 0;position:relative;z-index:1}
  .section-head{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;margin-bottom:56px;padding-bottom:24px;border-bottom:1px solid var(--divider)}
  .section-head h2{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:.9;margin:0;color:var(--cream)}
  .section-head h2 em{font-style:italic;font-weight:300;color:var(--wine)}
  .section-head .meta{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;color:var(--cream-2);text-align:right;line-height:1.7}
  .section-head .meta b{color:var(--wine)}

  /* === INFO (asymmetric tiles) === */
  .info-tiles{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:auto auto;gap:0;border-top:1px solid var(--divider);border-left:1px solid var(--divider)}
  .info-tile{padding:32px 28px;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);position:relative;background:rgba(31,20,24,.3);display:flex;flex-direction:column;gap:14px}
  .info-tile .lbl{display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.2em;color:var(--wine);text-transform:uppercase}
  .info-tile h3{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--cream);line-height:1}
  .info-tile h3 em{font-style:italic;font-weight:300;color:var(--wine)}
  .info-tile .body{font-size:13px;color:var(--cream-2);line-height:1.55}
  .info-tile.span2{grid-column:span 2}
  .info-tile .hrs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:auto}
  .info-tile .hrs .d{padding:10px 6px;border:1px solid var(--divider-2);text-align:center}
  .info-tile .hrs .d.today{border-color:var(--wine);background:rgba(177,52,73,.1)}
  .info-tile .hrs .d.today .day{color:var(--wine)}
  .info-tile .hrs .day{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--cream-2);display:block;margin-bottom:4px}
  .info-tile .hrs .v{font-size:11px;color:var(--cream);font-weight:500;white-space:nowrap}
  .info-tile .hrs .v.closed{color:var(--muted)}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;padding:6px 10px;border:1px solid var(--divider-2);color:var(--cream-2);background:rgba(0,0,0,.2);white-space:nowrap}

  /* branches block */
  .branches{display:flex;flex-direction:column;gap:14px}
  .branches .b{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed var(--divider-2);font-size:13px}
  .branches .b:last-child{border-bottom:none}
  .branches .b .n{color:var(--cream);font-weight:600}
  .branches .b .n .nt{font-size:11px;color:var(--cream-2);font-weight:400;margin-left:8px}
  .branches .b .d{font-family:ui-monospace,Menlo,monospace;color:var(--wine);font-weight:700}

  /* === OFFERS (offset cards w/ big numerals) === */
  .offers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
  .offer{padding:48px 36px;border-right:1px solid var(--divider);background:transparent;position:relative;display:flex;flex-direction:column;gap:18px;transition:.25s;overflow:hidden}
  .offer:last-child{border-right:none}
  .offer:hover{background:rgba(177,52,73,.05)}
  .offer .num{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:var(--wine)}
  .offer .big{font-size:120px;font-weight:800;color:rgba(177,52,73,.12);letter-spacing:-.06em;line-height:.85;position:absolute;right:18px;top:18px;pointer-events:none}
  .offer .tag{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);font-weight:800}
  .offer .title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--cream)}
  .offer .body{font-size:14px;color:var(--cream-2);line-height:1.55}
  .offer .chip{align-self:flex-start;background:var(--wine);color:var(--cream);border-color:var(--wine);font-weight:800}

  /* === TASTING (horizontal stacks) === */
  .tasting{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tcard{
    padding:48px 32px;background:linear-gradient(180deg, var(--bg-card), var(--bg-soft));
    border:1px solid var(--divider);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
    transition:.25s;
  }
  .tcard:hover{border-color:var(--wine);transform:translateY(-3px)}
  .tcard .roman{font-size:80px;font-weight:200;color:var(--wine);line-height:.8;letter-spacing:-.04em;font-style:italic}
  .tcard h3{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--cream);line-height:1.15}
  .tcard .row{display:flex;justify-content:space-between;padding:14px 0;border-top:1px dashed var(--divider-2);font-size:13px;color:var(--cream-2)}
  .tcard .row b{color:var(--wine);font-weight:800}
  .tcard .row .v{font-family:ui-monospace,Menlo,monospace;color:var(--cream);font-weight:600}

  /* === FEATURED (offset asymmetric grid) === */
  .feat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;grid-auto-flow:dense}
  .fcard{
    background:var(--bg-card);border:1px solid var(--divider);overflow:hidden;
    cursor:pointer;transition:.25s;display:flex;flex-direction:column;
  }
  .fcard:hover{border-color:var(--wine);transform:translateY(-3px)}
  .fcard .ph{aspect-ratio:4/3;background:var(--bg-card);overflow:hidden}
  .fcard .ph svg{width:100%;height:100%;display:block}
  .fcard .body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .fcard .meta{display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--cream-2)}
  .fcard .meta .cat{color:var(--wine)}
  .fcard .name{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15;color:var(--cream)}
  .fcard .desc{font-size:13px;color:var(--cream-2);line-height:1.55;flex:1}
  .fcard .bottom{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--divider)}
  .fcard .pr{font-size:18px;font-weight:800;color:var(--wine);font-feature-settings:"tnum"}
  .dietary{display:flex;gap:6px;flex-wrap:wrap}
  .diet{font-size:9px;letter-spacing:.22em;font-weight:800;padding:4px 7px;background:rgba(177,52,73,.12);color:var(--wine);border:1px solid var(--wine-deep)}
  .add-btn{background:var(--cream);color:var(--bg);border:none;padding:9px 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;display:inline-flex;gap:8px;align-items:center;transition:.2s;font-family:inherit;cursor:pointer}
  .add-btn:hover{background:var(--wine);color:var(--cream)}

  /* spans */
  .fcard.s3{grid-column:span 3}
  .fcard.s2{grid-column:span 2}
  .fcard.s4{grid-column:span 4}
  .fcard.s3 .ph{aspect-ratio:16/9}
  .fcard.s4 .ph{aspect-ratio:16/8}

  /* === MENU BROWSE (top tabs + two-col cards) === */
  .menu-top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--divider)}
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .cat-tab{
    background:transparent;border:1px solid var(--divider-2);color:var(--cream-2);padding:10px 18px;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-family:inherit;transition:.2s;
  }
  .cat-tab:hover{color:var(--cream);border-color:var(--cream-2)}
  .cat-tab.active{background:var(--cream);color:var(--bg);border-color:var(--cream)}
  .menu-tools-r{display:flex;gap:6px;align-items:center}
  .search{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--divider-2);background:var(--bg-soft);min-width:280px}
  .search input{background:transparent;border:none;outline:none;color:var(--cream);font-family:inherit;width:100%;font-size:13px}
  .search input::placeholder{color:var(--muted)}
  .filter{background:transparent;border:1px solid var(--divider-2);color:var(--cream-2);padding:10px 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-family:inherit;transition:.2s;cursor:pointer}
  .filter.active{background:var(--wine);color:var(--cream);border-color:var(--wine)}
  .filter:hover{color:var(--cream);border-color:var(--wine)}
  select.sort{background:var(--bg-soft);border:1px solid var(--divider-2);color:var(--cream-2);padding:11px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-family:inherit}

  .cat-block.hidden{display:none}
  .cat-head-bar{display:flex;justify-content:space-between;align-items:end;padding:16px 0 18px;border-bottom:1px solid var(--divider);margin-bottom:24px}
  .cat-head-bar .l{display:flex;align-items:baseline;gap:18px}
  .cat-head-bar h3{font-size:48px;font-weight:800;letter-spacing:-.03em;margin:0;color:var(--cream);line-height:1}
  .cat-head-bar .sub{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;color:var(--cream-2)}
  .cat-head-bar .ct{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;color:var(--wine)}

  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:64px;border-bottom:1px solid var(--divider)}
  .item{
    display:grid;grid-template-columns:140px 1fr;gap:20px;padding:24px;border-bottom:1px solid var(--divider);border-right:1px solid var(--divider);align-items:start;cursor:pointer;transition:.2s;
  }
  .item:nth-child(2n){border-right:none}
  .item:hover{background:rgba(177,52,73,.04)}
  .item .ph{aspect-ratio:1;background:var(--bg-card);border:1px solid var(--divider);overflow:hidden}
  .item .ph svg{width:100%;height:100%;display:block}
  .item .body{display:flex;flex-direction:column;gap:8px;min-width:0}
  .item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .item .name{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--cream)}
  .item .name .pop{display:inline-block;background:var(--wine);color:var(--cream);font-size:9px;letter-spacing:.22em;padding:2px 6px;margin-left:8px;font-weight:800;vertical-align:middle}
  .item .price{font-size:18px;font-weight:800;color:var(--wine);font-feature-settings:"tnum";white-space:nowrap}
  .item .desc{font-size:13px;color:var(--cream-2);line-height:1.55}
  .item .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px;flex-wrap:wrap}
  .item.eightysix{opacity:.55}
  .item.eightysix .price{text-decoration:line-through;text-decoration-thickness:1px}
  .eta{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:4px 8px;background:rgba(255,80,80,.1);border:1px solid rgba(255,120,120,.3);color:#f5b3a8}

  /* === LOYALTY === */
  .loyalty{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border:1px solid var(--divider);overflow:hidden}
  .loy-l{padding:56px 48px;background:linear-gradient(135deg, var(--bg-card), var(--bg-soft));position:relative;display:flex;flex-direction:column;gap:24px}
  .loy-l::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--wine)}
  .loy-l .top{display:flex;align-items:center;gap:20px;margin-top:8px}
  .avatar{width:72px;height:72px;background:var(--wine);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.05em;font-size:22px}
  .loy-l .greet{font-size:36px;font-weight:800;letter-spacing:-.02em;color:var(--cream);line-height:1.1}
  .loy-l .tier{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:var(--wine);margin-top:6px;text-transform:uppercase}
  .pts{display:flex;align-items:baseline;gap:18px;padding:24px 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
  .pts .big{font-size:96px;font-weight:800;color:var(--cream);letter-spacing:-.06em;line-height:.9;font-feature-settings:"tnum"}
  .pts .info{display:flex;flex-direction:column;gap:4px}
  .pts .info .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-2);font-weight:700}
  .pts .info .next{font-size:13px;color:var(--wine);font-weight:600}
  .progress{height:6px;background:var(--divider-2);position:relative}
  .progress .bar{height:100%;background:var(--wine)}

  .loy-r{padding:56px 48px;background:var(--bg);display:flex;flex-direction:column;gap:18px}
  .loy-r h4{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);margin:0;font-weight:800}
  .reord{display:flex;flex-direction:column;gap:10px}
  .reord-row{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;background:var(--bg-soft);border:1px solid var(--divider);gap:14px;transition:.2s}
  .reord-row:hover{border-color:var(--wine)}
  .reord-row .n{font-size:14px;font-weight:600;color:var(--cream)}
  .reord-row .w{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:4px}
  .reord-row .r{display:flex;align-items:center;gap:14px}
  .reord-row .pr{font-size:14px;font-weight:800;color:var(--wine)}
  .reord-row button{background:transparent;border:1px solid var(--divider-2);color:var(--cream-2);padding:8px 12px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;font-family:inherit;transition:.2s;cursor:pointer}
  .reord-row button:hover{border-color:var(--wine);color:var(--wine)}
  .fav-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
  .fav-row .f{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;padding:8px 12px;background:rgba(177,52,73,.1);color:var(--wine);border:1px solid var(--wine-deep);display:inline-flex;gap:8px;align-items:center}

  /* === FOOTER === */
  footer{padding:80px 0 32px;border-top:1px solid var(--divider);margin-top:80px;position:relative;z-index:1}
  footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:48px;align-items:start}
  footer .wm{font-size:48px;font-weight:800;letter-spacing:-.03em;color:var(--cream);margin:0 0 12px;line-height:1}
  footer .wm em{font-style:italic;color:var(--wine);font-weight:300}
  footer .tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;color:var(--cream-2);text-transform:uppercase}
  footer h5{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);margin:0 0 16px;font-weight:800}
  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--cream-2)}
  footer .copyright{grid-column:1/-1;margin-top:64px;padding-top:24px;border-top:1px solid var(--divider);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between}

  /* === DRAWER === */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;
    background:var(--bg-soft);border-left:1px solid var(--divider);z-index:100;
    transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .drawer .head{padding:24px 28px;border-bottom:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center}
  .drawer .head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--cream)}
  .drawer .body{flex:1;overflow-y:auto;padding:8px 28px}
  .drawer .empty{padding:80px 24px;text-align:center;color:var(--muted)}
  .drawer .empty .big{font-size:24px;color:var(--cream-2);font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
  .cart-line{display:grid;grid-template-columns:64px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--divider);align-items:center}
  .cart-line .th{width:64px;height:64px;background:var(--bg-card);border:1px solid var(--divider);overflow:hidden}
  .cart-line .th svg{width:100%;height:100%;display:block}
  .cart-line .n{font-size:14px;font-weight:600;color:var(--cream);line-height:1.2;margin-bottom:6px}
  .cart-line .qty{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cream-2)}
  .qbtn{width:26px;height:26px;border:1px solid var(--divider-2);background:transparent;color:var(--cream-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .qbtn:hover{border-color:var(--wine);color:var(--wine)}
  .cart-line .pr{font-size:14px;color:var(--wine);font-feature-settings:"tnum";font-weight:800}
  .drawer .foot{border-top:1px solid var(--divider);padding:24px 28px;display:flex;flex-direction:column;gap:16px}
  .drawer .tot{display:flex;justify-content:space-between;align-items:end}
  .drawer .tot .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-2);font-weight:700}
  .drawer .tot .v{font-size:36px;font-weight:800;color:var(--wine);font-feature-settings:"tnum";letter-spacing:-.03em}
  .drawer .ckbtn{padding:18px;justify-content:space-between;width:100%}

  /* === MODAL === */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:110;opacity:0;pointer-events:none;transition:opacity .25s;padding:40px}
  .modal.show{opacity:1;pointer-events:auto}
  .modal .card{
    background:var(--bg-soft);border:1px solid var(--divider);max-width:920px;width:100%;max-height:90vh;
    display:grid;grid-template-columns:1fr 1fr;overflow:hidden;transform:translateY(20px);transition:transform .35s;
  }
  .modal.show .card{transform:none}
  .modal .ph{background:var(--bg-card);position:relative}
  .modal .ph svg{width:100%;height:100%;display:block}
  .modal .right{padding:36px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;max-height:90vh}
  .modal .close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5)}
  .modal h2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--cream);line-height:1.1}
  .modal .desc{font-size:14px;color:var(--cream-2);line-height:1.6}
  .modal .price-big{font-size:36px;color:var(--wine);font-weight:800;font-feature-settings:"tnum";letter-spacing:-.03em}
  .opt-group h5{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);margin:0 0 10px;font-weight:800}
  .opt-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dotted var(--divider-2);font-size:13px;color:var(--cream-2);cursor:pointer}
  .opt-row .rad{width:14px;height:14px;border:1px solid var(--divider-2);flex:0 0 auto;margin-right:12px;display:inline-flex;align-items:center;justify-content:center}
  .opt-row.sel .rad{border-color:var(--wine);background:var(--wine)}
  .opt-row.sel .rad::after{content:"";width:6px;height:6px;background:var(--cream)}
  .opt-row.sel{color:var(--cream)}
  .opt-name{flex:1;display:flex;align-items:center}
  .opt-pr{color:var(--wine);font-weight:600}

  .login-card{background:var(--bg-soft);border:1px solid var(--divider);max-width:480px;width:100%;padding:40px}
  .login-card h2{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--cream);margin:0 0 8px}
  .login-card .sub{font-size:13px;color:var(--cream-2);margin-bottom:32px}
  .login-card label{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);font-weight:800;display:block;margin-bottom:8px}
  .login-card input{width:100%;background:var(--bg);border:1px solid var(--divider-2);color:var(--cream);font-family:inherit;font-size:14px;padding:12px;outline:none;margin-bottom:18px;font-weight:500}
  .login-card input:focus{border-color:var(--wine)}
  .tenant{padding:14px;border:1px solid var(--divider-2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
  .tenant:hover{border-color:var(--wine)}
  .tenant.sel{border-color:var(--wine);background:rgba(177,52,73,.08)}
  .tenant .n{font-size:14px;color:var(--cream);font-weight:600}
  .tenant .meta{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--muted)}

  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--bg);padding:14px 24px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;z-index:120;opacity:0;transition:.3s;display:flex;gap:12px;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .dot{width:6px;height:6px;background:var(--wine)}

  @media (max-width: 980px){
    .wrap{padding:0 24px}
    .nav-inner{padding:0 24px}
    .hero-grid{grid-template-columns:1fr}
    .hero-l h1{font-size:80px}
    .info-tiles, .offers-grid, .feat-grid, .tasting, .loyalty{grid-template-columns:1fr}
    .item-grid{grid-template-columns:1fr}
    .item{border-right:none}
    footer .wrap{grid-template-columns:1fr 1fr}
    .modal .card{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="shared/data.js"></script>
<script src="shared/icons.js"></script>
<script src="shared/placeholder.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="v2-editorial-app.jsx"></script>
</body>
</html>
